; SUMP device emulator — see README.md.
;
; Each env is a "persona": a different device for the app to identify, so the
; SUMP backend's branches can be exercised without owning the hardware.
;
;   pio run -e c3      -t upload   ESP32-Bit-Pirate-alike (no hardware trigger)
;   pio run -e c3-ols  -t upload   Open Logic Sniffer     (hardware trigger)
;   pio run -e c3-bare -t upload   silent 0x04            (generic fallback)
;   pio run -e c3-deep -t upload   1 MiB of memory        (32-bit count commands)

[platformio]
default_envs = c3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

; Native USB boards expose a CDC port Web Serial can open with no USB-UART
; bridge in between. Harmless on the classic ESP32, which ignores both.
[usb_cdc]
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; --- ESP32-C3 -----------------------------------------------------------------

[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    ${usb_cdc.build_flags}
    -DDEV_NAME='"ESP32-C3 SUMP emulator"' 

[env:c3-ols]
board = esp32-c3-devkitm-1
build_flags =
    ${usb_cdc.build_flags}
    -DDEV_NAME='"Open Logic Sniffer v1.01"'
    -DDEV_FIRMWARE='"3.07"'
    -DDEV_HW_TRIGGER=1
    -DDEV_BUGGY_LONG_CMDS=0
    -DDEV_MEMORY=24576UL

; Answers the ID but stays silent on 0x04, so the app has to fall back to its
; generic profile (100 MHz clock, 4 KiB, 8 channels).
[env:c3-bare]
board = esp32-c3-devkitm-1
build_flags =
    ${usb_cdc.build_flags}
    -DDEV_SEND_METADATA=0

; Reports more memory than the 16-bit CMD_CAPTURE_SIZE can address, which is the
; only way to make a host reach for 0x84/0x83 — so this is the persona that
; exercises that branch. Nothing is actually buffered: the pattern repeats.
[env:c3-deep]
board = esp32-c3-devkitm-1
build_flags =
    ${usb_cdc.build_flags}
    -DDEV_NAME='"Deep SUMP emulator"'
    -DDEV_MEMORY=1048576UL
    -DDEV_WIDE_COUNTS=1
    -DDEV_BUGGY_LONG_CMDS=0

; --- Other boards, same personas ----------------------------------------------

[env:s3]
board = esp32-s3-devkitc-1
build_flags =
    ${usb_cdc.build_flags}
    -DDEV_NAME='"ESP32-S3 SUMP emulator"' 

; Classic ESP32 has no native USB: this appears on the board's USB-UART bridge.
[env:esp32]
board = esp32dev
