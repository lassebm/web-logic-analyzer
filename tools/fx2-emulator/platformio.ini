; FX2 / fx2lafw device emulator — see README.md.
;
; Each env is a "persona": a different device for the app to enumerate, so the
; FX2 backend's branches can be exercised without owning the hardware. Every
; persona is built for both boards — swap the s3- prefix for s2-:
;
;   pio run -e s3       -t upload   a device already running fx2lafw
;   pio run -e s3-stock -t upload   a stock Cypress FX2: upload + re-enumerate
;   pio run -e s3-ep1   -t upload   samples on EP 0x81, not the usual 0x82
;   pio run -e s3-stall -t upload   dies mid-capture, like an overflowed FIFO
;   pio run -e s3-oldfw -t upload   fx2lafw 0.x, which the app must refuse
;   pio run -e s3-tick  -t upload   one UART line a second, for the live views
;
; S2/S3 only: this needs the USB-OTG peripheral and custom descriptors, and the
; C3's USB is a fixed-function serial/JTAG bridge.

[platformio]
default_envs = s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

; --- Personas -----------------------------------------------------------------
; What each persona adds. None of it is board-specific, so the boards below
; carry a persona in one line apiece and the two stay in step.

[persona]
; Boots with no firmware on a stock Cypress identity (04b4:8613), so the app
; uploads fx2lafw-cypress-fx2.fw and waits for the device to come back. Reboots
; into the running identity when the host releases the 8051 from reset.
stock = -DDEV_STOCK=1
; Samples on EP 0x81. A host that assumes fx2lafw's 0x82 instead of reading the
; endpoint out of the descriptor gets nothing at all here.
ep1 = -DDEV_BULK_EP=1
; Goes silent after 256 KiB and never resumes, which is what an FX2 whose FIFO
; overflowed does. Only the host's stall watchdog ends that capture.
stall = -DDEV_STALL_AFTER_KB=256
; Reports fx2lafw 0.4. The app requires major 1, so it must refuse this device.
oldfw = -DDEV_FW_MAJOR=0 -DDEV_FW_MINOR=4
; Drops the demo cycle for one UART line a second on D0, everything else idle.
; The demo cycle is 6.5 ms long, so it says nothing about a view that scrolls;
; this one is mostly silence, which is what Follow and the Serial Monitor are for.
tick = -DDEV_TICK_MS=1000

; --- ESP32-S3 -----------------------------------------------------------------
; The board default is ARDUINO_USB_MODE=1 (hardware CDC/JTAG on the native port).
; We need 0 — TinyUSB, so the port can be something other than a serial device —
; and board_build.extra_flags replaces the board's list rather than adding to it.
; CDC_ON_BOOT stays off so our vendor interface is the only one: an interface the
; OS binds a class driver to is one WebUSB cannot claim. `Serial` is then UART0,
; which is where the emulator's log goes — see README.

[s3]
board = esp32-s3-devkitc-1
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0

[env:s3]
extends = s3

[env:s3-stock]
extends = s3
build_flags = ${s3.build_flags} ${persona.stock}

[env:s3-ep1]
extends = s3
build_flags = ${s3.build_flags} ${persona.ep1}

[env:s3-stall]
extends = s3
build_flags = ${s3.build_flags} ${persona.stall}

[env:s3-oldfw]
extends = s3
build_flags = ${s3.build_flags} ${persona.oldfw}

[env:s3-tick]
extends = s3
build_flags = ${s3.build_flags} ${persona.tick}

; --- ESP32-S2 -----------------------------------------------------------------
; TinyUSB is the S2's only USB mode, so nothing needs overriding here. Another
; S2 board is just a different `board =` — the personas don't care.

[s2]
board = esp32-s2-saola-1
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0

[env:s2]
extends = s2

[env:s2-stock]
extends = s2
build_flags = ${s2.build_flags} ${persona.stock}

[env:s2-ep1]
extends = s2
build_flags = ${s2.build_flags} ${persona.ep1}

[env:s2-stall]
extends = s2
build_flags = ${s2.build_flags} ${persona.stall}

[env:s2-oldfw]
extends = s2
build_flags = ${s2.build_flags} ${persona.oldfw}

[env:s2-tick]
extends = s2
build_flags = ${s2.build_flags} ${persona.tick}
